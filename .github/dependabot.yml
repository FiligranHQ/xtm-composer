version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # AWS-LC-FIPS 3 is the FIPS 140-3 validated module: from aws-lc-rs 1.18.0, the
    # fips feature builds on AWS-LC-FIPS 4, which is not certified yet. rustls 0.23.44
    # and rustls-webpki 0.103.14 and later require aws-lc-rs 1.18.
    ignore:
      - dependency-name: "aws-lc-rs"
        versions: [">=1.18.0"]
      - dependency-name: "rustls"
        versions: [">=0.23.44"]
      - dependency-name: "rustls-webpki"
        versions: [">=0.103.14"]
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
